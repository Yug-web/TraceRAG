services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: tracerag
      POSTGRES_DB: tracerag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracerag -d tracerag"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
