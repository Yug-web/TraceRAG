[project]
name = "tracerag-backend"
version = "0.1.0"
description = "Evidence-first research assistant API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.34,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.16,<2",
    "psycopg[binary]>=3.2,<4",
    "pypdf>=6,<7",
    "pgvector>=0.4,<1",
    "sentence-transformers>=5.7,<6",
    "google-genai>=1,<3",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
